<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#0d9488" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.15" />
    </filter>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <!-- Clock Design -->
  <g filter="url(#shadow)">
    <!-- Outer Ring -->
    <circle cx="256" cy="256" r="140" fill="none" stroke="#ffffff" stroke-width="24" stroke-linecap="round" />
    <!-- Clock Hands -->
    <line x1="256" y1="256" x2="256" y2="160" stroke="#ffffff" stroke-width="20" stroke-linecap="round" />
    <line x1="256" y1="256" x2="330" y2="256" stroke="#ffffff" stroke-width="20" stroke-linecap="round" />
    <!-- Center Dot -->
    <circle cx="256" cy="256" r="18" fill="#ffffff" />
  </g>
</svg>

